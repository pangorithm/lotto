services:
  daemon:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/lottery-daemon:local
    environment:
      LOTTERY_DB: /var/lib/lottery/lottery.sqlite3
      LOTTERY_SEED: /opt/lottery/seed.sqlite3
      LOTTERY_BASE_URL: ${LOTTERY_BASE_URL:-https://www.dhlottery.co.kr/}
      LOTTERY_INTERVAL_SECONDS: ${LOTTERY_INTERVAL_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - state:/var/lib/lottery:U
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  state:
